[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-whisper"
version = "0.1.3"
description = "Read a failed CI log and get the first real error, its causal chain, and a fix."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mgkvibez" }]
keywords = ["ci", "github-actions", "logs", "debugging", "developer-tools", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ci-whisper = "ci_whisper.cli:main"

[tool.setuptools]
packages = ["ci_whisper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
